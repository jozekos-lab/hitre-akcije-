<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jože's action list</title>
<link id="favicon" rel="icon" type="image/png">
<link id="appleIcon" rel="apple-touch-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #1C1A17;
    --board-hi: #24211D;
    --paper: #E7ECE9;
    --paper-dim: #D9DFDB;
    --ink: #23281F;
    --ink-soft: #565F55;
    --muted: #8B9187;
    --coral: #FF6B4A;
    --coral-dim: #C9563B;
    --green: #4FB286;
    --amber: #E8A93B;
    --line: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--board);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.025) 0%, transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(255,255,255,0.02) 0%, transparent 45%);
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header { margin-bottom: 24px; }

  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-badge {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--coral);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 6px 14px -6px rgba(255,107,74,0.55);
  }

  header .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--coral);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 34px;
    margin: 0 0 6px;
    color: var(--paper);
    letter-spacing: -0.01em;
  }

  header p.sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ---- Capture form ---- */
  .capture {
    background: var(--board-hi);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin: 22px 0 22px;
    box-shadow: 0 12px 30px -12px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 2px;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .field-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 11px 12px;
    min-width: 0;
  }

  .field-row input::placeholder { color: var(--muted); }

  .mic-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    margin-right: 5px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  .mic-btn:hover { background: rgba(255,255,255,0.07); }

  .mic-btn.listening {
    background: var(--coral);
    border-color: var(--coral);
    animation: pulse 1.1s ease-in-out infinite;
  }

  .mic-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,74,0.5); }
    50% { box-shadow: 0 0 0 7px rgba(255,107,74,0); }
  }

  .due-hint {
    font-size: 11px;
    color: var(--muted);
    padding-left: 2px;
  }

  .add-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 2px;
  }

  .save-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .save-status.show { opacity: 1; }
  .save-status.ok { color: var(--green); }
  .save-status.err { color: var(--coral); }

  #addBtn {
    background: var(--coral);
    color: #1C1A17;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  #addBtn:hover { background: #ff7f62; }
  #addBtn:active { transform: scale(0.97); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .tabs button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s ease;
  }

  .tabs button.active { color: var(--paper); border-bottom-color: var(--coral); }
  .tabs button:hover:not(.active) { color: var(--paper-dim); }

  /* ---- List / notes ---- */
  .list { display: flex; flex-direction: column; gap: 10px; }

  .note {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    padding: 14px 44px 14px 18px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,0.5);
    animation: settle 0.28s ease;
  }

  .note:nth-child(odd) { transform: rotate(-0.4deg); }
  .note:nth-child(even) { transform: rotate(0.4deg); }

  @keyframes settle {
    from { opacity: 0; transform: translateY(-8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .pin {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--ink-soft);
    background: transparent;
    cursor: pointer;
    margin-top: 3px;
    position: relative;
    transition: all 0.15s ease;
  }

  .pin::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 2px;
    width: 5px;
    height: 9px;
    border: solid var(--ink-soft);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    opacity: 0.28;
    transition: all 0.15s ease;
  }

  .pin:hover::after { opacity: 0.6; }

  .note.done .pin { background: var(--green); border-color: var(--green); }

  .note.done .pin::after { border-color: #fff; opacity: 1; }

  .note-body { flex: 1; min-width: 0; }

  .note-title {
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
  }

  .note.done .note-title { text-decoration: line-through; color: var(--ink-soft); }

  .note-topics {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-soft);
    margin-top: 3px;
    word-break: break-word;
  }

  .note.done .note-topics { text-decoration: line-through; }

  .note-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .due-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: #1C1A17;
    background: var(--amber);
    border-radius: 6px;
    padding: 3px 8px;
  }

  .note.done .due-badge { background: var(--paper-dim); color: var(--ink-soft); }

  .note-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .del {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
  }

  .note:hover .del { opacity: 1; }
  .del:hover { color: var(--coral-dim); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

  .empty .big {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--paper-dim);
    margin-bottom: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    .note { animation: none; }
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--coral);
    outline-offset: 2px;
  }

  @media (max-width: 420px) {
    .field-row input { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Hitro. Kratko. Zdaj.</p>
    <div class="title-row">
      <div class="icon-badge" aria-hidden="true">🥷</div>
      <h1>Jože's action list</h1>
    </div>
    <p class="sub">Naslov, kaj je treba narediti in do kdaj — z vpisom ali govorom.</p>
  </header>

  <div class="capture">
    <div class="field">
      <label for="titleInput">Naslov</label>
      <div class="field-row">
        <input type="text" id="titleInput" placeholder="Npr. Tender Sadolin – priprava dokumentov" maxlength="120">
        <button class="mic-btn" type="button" data-target="titleInput" aria-label="Vnesi naslov z govorom" title="Vnesi z govorom">🎙️</button>
      </div>
    </div>

    <div class="field">
      <label for="topicsInput">Kaj je treba narediti</label>
      <div class="field-row">
        <input type="text" id="topicsInput" placeholder="Pripraviti, urediti ali poslati…" maxlength="240">
        <button class="mic-btn" type="button" data-target="topicsInput" aria-label="Vnesi opis z govorom" title="Vnesi z govorom">🎙️</button>
      </div>
    </div>

    <div class="field">
      <label for="dueInput">Do kdaj</label>
      <div class="field-row">
        <input type="text" id="dueInput" placeholder="Npr. sredina tedna, konec tedna, petek…" maxlength="80">
        <button class="mic-btn" type="button" data-target="dueInput" aria-label="Vnesi rok z govorom" title="Vnesi z govorom">🎙️</button>
      </div>
      <div class="due-hint" id="dueHint">Lahko tudi opisno: začetek tedna, sredina tedna, konec tedna, jutri, petek …</div>
    </div>

    <div class="add-row">
      <span id="saveStatus" class="save-status"></span>
      <button id="addBtn">Dodaj akcijo</button>
    </div>
  </div>

  <div class="tabs">
    <button class="active" data-filter="active">Aktivno</button>
    <button data-filter="done">Opravljeno</button>
    <button data-filter="all">Vse</button>
  </div>

  <div class="list" id="list"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJHL3n1QPBHA9BxTIhUHqUUD0meHDm_UM",
    authDomain: "joze-s--action-list-1.firebaseapp.com",
    databaseURL: "https://joze-s--action-list-1-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "joze-s--action-list-1",
    storageBucket: "joze-s--action-list-1.firebasestorage.app",
    messagingSenderId: "1088142471954",
    appId: "1:1088142471954:web:2235651887e4082c8039cb"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  const actionsDocRef = doc(db, "actions", "joze");

  /* ---------- App icon ---------- */
  function generateAppIcon() {
    const size = 192;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const r = size * 0.22;
    ctx.fillStyle = '#FF6B4A';
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.arcTo(size, 0, size, size, r);
    ctx.arcTo(size, size, 0, size, r);
    ctx.arcTo(0, size, 0, 0, r);
    ctx.arcTo(0, 0, size, 0, r);
    ctx.closePath();
    ctx.fill();
    ctx.font = (size * 0.62) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🥷', size / 2, size / 2 + size * 0.04);
    const dataUrl = canvas.toDataURL('image/png');
    document.getElementById('favicon').href = dataUrl;
    document.getElementById('appleIcon').href = dataUrl;
  }
  generateAppIcon();

  /* ---------- State ---------- */
  let items = [];
  let filter = 'active';
  let suppressNextSnapshotEcho = false;

  const listEl = document.getElementById('list');
  const titleInput = document.getElementById('titleInput');
  const topicsInput = document.getElementById('topicsInput');
  const dueInput = document.getElementById('dueInput');
  const addBtn = document.getElementById('addBtn');
  const tabs = document.querySelectorAll('.tabs button');

  /* ---------- Slovenian descriptive due-date parsing ---------- */
  const WEEKDAY_NAMES = ['nedelja','ponedeljek','torek','sreda','četrtek','petek','sobota'];
  const WEEKDAY_SHORT = ['Ned','Pon','Tor','Sre','Čet','Pet','Sob'];

  function startOfWeek(d) {
    // Monday-based start of week
    const date = new Date(d);
    const day = date.getDay(); // 0 = Sunday
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0, 0, 0, 0);
    return date;
  }

  function addDays(d, n) {
    const date = new Date(d);
    date.setDate(date.getDate() + n);
    return date;
  }

  function fmtDay(d) {
    return d.toLocaleDateString('sl-SI', { day: 'numeric', month: 'short' });
  }

  function fmtRange(d1, d2) {
    const w1 = WEEKDAY_SHORT[d1.getDay()];
    const w2 = WEEKDAY_SHORT[d2.getDay()];
    if (d1.toDateString() === d2.toDateString()) return w1 + ', ' + fmtDay(d1);
    return w1 + '–' + w2 + ', ' + fmtDay(d1) + '–' + fmtDay(d2);
  }

  // Returns { label: string for display, sortDate: Date } or null if nothing recognized
  function resolveDueDate(rawText) {
    if (!rawText) return null;
    const text = rawText.toLowerCase().trim();
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const isNext = /naslednj/.test(text);
    let weekBase = startOfWeek(today);
    if (isNext) weekBase = addDays(weekBase, 7);

    // explicit "today" / "tomorrow" / "day after tomorrow"
    if (/\bdanes\b/.test(text)) {
      return { label: 'Danes, ' + fmtDay(today), sortDate: today };
    }
    if (/\bjutri\b/.test(text) && !/pojutri/.test(text)) {
      const d = addDays(today, 1);
      return { label: 'Jutri, ' + fmtDay(d), sortDate: d };
    }
    if (/pojutri/.test(text)) {
      const d = addDays(today, 2);
      return { label: WEEKDAY_SHORT[d.getDay()] + ', ' + fmtDay(d), sortDate: d };
    }

    // start / middle / end of week phrases
    if (/začet/.test(text) && /teden|tedna|tednu/.test(text)) {
      const d1 = weekBase;
      const d2 = addDays(weekBase, 1);
      return { label: fmtRange(d1, d2), sortDate: d1 };
    }
    if (/sredin/.test(text) && /teden|tedna|tednu/.test(text)) {
      const d = addDays(weekBase, 2);
      return { label: WEEKDAY_SHORT[d.getDay()] + ', ' + fmtDay(d), sortDate: d };
    }
    if (/konec/.test(text) && /teden|tedna|tednu/.test(text)) {
      const d1 = addDays(weekBase, 3);
      const d2 = addDays(weekBase, 4);
      return { label: fmtRange(d1, d2), sortDate: d1 };
    }

    // explicit weekday name, this week or next (if "naslednji" or already passed this week -> next occurrence)
    for (let i = 0; i < WEEKDAY_NAMES.length; i++) {
      const name = WEEKDAY_NAMES[i];
      const shortForms = {
        'ponedeljek': 'pon', 'torek': 'tor', 'sreda': 'sre',
        'četrtek': 'čet', 'petek': 'pet', 'sobota': 'sob', 'nedelja': 'ned'
      };
      const pattern = new RegExp('\\b(' + name + '|' + shortForms[name] + ')\\b');
      if (pattern.test(text)) {
        // JS getDay(): 0=Sun..6=Sat ; our WEEKDAY_NAMES index matches that
        const targetDow = i;
        let base = isNext ? weekBase : startOfWeek(today);
        let d = addDays(base, (targetDow === 0 ? 6 : targetDow - 1)); // Monday-based offset
        if (!isNext && d < today) d = addDays(d, 7); // roll to next occurrence if already passed
        return { label: WEEKDAY_SHORT[d.getDay()] + ', ' + fmtDay(d), sortDate: d };
      }
    }

    // explicit numeric date like 15.8. or 15.8.2026 or 15. avgust
    const numMatch = text.match(/(\d{1,2})\s*\.\s*(\d{1,2})\s*\.?\s*(\d{4})?/);
    if (numMatch) {
      const day = parseInt(numMatch[1], 10);
      const month = parseInt(numMatch[2], 10) - 1;
      const year = numMatch[3] ? parseInt(numMatch[3], 10) : today.getFullYear();
      const d = new Date(year, month, day);
      if (!isNaN(d)) {
        return { label: WEEKDAY_SHORT[d.getDay()] + ', ' + fmtDay(d), sortDate: d };
      }
    }

    // nothing recognized — keep raw text as the label, no sort date
    return { label: rawText.trim(), sortDate: null };
  }

  function timeAgo(ts) {
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const time = d.toLocaleTimeString('sl-SI', { hour: '2-digit', minute: '2-digit' });
    if (sameDay) return 'dodano danes, ' + time;
    return 'dodano ' + d.toLocaleDateString('sl-SI', { day: 'numeric', month: 'short' }) + ', ' + time;
  }

  function completedOn(ts) {
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const time = d.toLocaleTimeString('sl-SI', { hour: '2-digit', minute: '2-digit' });
    if (sameDay) return 'Opravljeno danes, ' + time;
    return 'Opravljeno ' + d.toLocaleDateString('sl-SI', { day: 'numeric', month: 'short' }) + ', ' + time;
  }

  /* ---------- Firestore sync (real-time, across all devices) ---------- */
  const saveStatusEl = document.getElementById('saveStatus');
  let statusTimer = null;

  function showStatus(text, kind) {
    saveStatusEl.textContent = text;
    saveStatusEl.className = 'save-status show ' + kind;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => {
      saveStatusEl.classList.remove('show');
    }, 2500);
  }

  function load() {
    onSnapshot(actionsDocRef, (snap) => {
      if (suppressNextSnapshotEcho) {
        suppressNextSnapshotEcho = false;
        return;
      }
      const data = snap.data();
      items = (data && data.items) ? data.items : [];
      render();
    }, (err) => {
      console.error('Firestore branje ni uspelo', err);
      showStatus('✕ Ni povezave z bazo', 'err');
    });
  }

  async function save() {
    try {
      suppressNextSnapshotEcho = true;
      await setDoc(actionsDocRef, { items: items, updatedAt: Date.now() });
      showStatus('✓ Shranjeno', 'ok');
    } catch (e) {
      console.error('Shranjevanje ni uspelo', e);
      showStatus('✕ Napaka: ' + (e && e.code ? e.code : 'shranjevanje ni uspelo'), 'err');
    }
  }

  /* ---------- CRUD ---------- */
  function addItem(title, topics, dueRaw) {
    const t = title.trim();
    if (!t) return;
    const due = resolveDueDate(dueRaw);
    items.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: t,
      topics: topics.trim(),
      dueRaw: dueRaw.trim(),
      dueLabel: due ? due.label : '',
      dueSort: due && due.sortDate ? due.sortDate.getTime() : null,
      done: false,
      createdAt: Date.now(),
      completedAt: null
    });
    save();
    render();
  }

  function toggleItem(id) {
    const it = items.find(i => i.id === id);
    if (it) {
      it.done = !it.done;
      it.completedAt = it.done ? Date.now() : null;
    }
    save();
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  /* ---------- Render ---------- */
  function render() {
    let filtered = items;
    if (filter === 'active') filtered = items.filter(i => !i.done);
    if (filter === 'done') filtered = items.filter(i => i.done);

    listEl.innerHTML = '';

    if (filtered.length === 0) {
      const emptyMsgs = {
        active: ['Prazno tukaj.', 'Vse aktivne akcije so opravljene ali pa jih še ni.'],
        done: ['Še nič opravljenega.', 'Ko odkljukaš akcijo, se prikaže tukaj.'],
        all: ['Še brez zapiskov.', 'Dodaj prvo akcijo zgoraj.']
      };
      const [big, small] = emptyMsgs[filter];
      const div = document.createElement('div');
      div.className = 'empty';
      div.innerHTML = '<div class="big">' + big + '</div><div>' + small + '</div>';
      listEl.appendChild(div);
      return;
    }

    filtered.forEach(item => {
      const note = document.createElement('div');
      note.className = 'note' + (item.done ? ' done' : '');

      const pin = document.createElement('button');
      pin.className = 'pin';
      pin.setAttribute('aria-label', item.done ? 'Označi kot neopravljeno' : 'Označi kot opravljeno');
      pin.onclick = () => toggleItem(item.id);

      const body = document.createElement('div');
      body.className = 'note-body';

      const titleEl = document.createElement('div');
      titleEl.className = 'note-title';
      titleEl.textContent = item.title;
      body.appendChild(titleEl);

      if (item.topics) {
        const topicsEl = document.createElement('div');
        topicsEl.className = 'note-topics';
        topicsEl.textContent = item.topics;
        body.appendChild(topicsEl);
      }

      const meta = document.createElement('div');
      meta.className = 'note-meta';

      if (item.dueLabel) {
        const badge = document.createElement('span');
        badge.className = 'due-badge';
        badge.textContent = '📅 ' + item.dueLabel;
        meta.appendChild(badge);
      }

      const timeEl = document.createElement('span');
      timeEl.className = 'note-time';
      timeEl.textContent = (item.done && item.completedAt) ? completedOn(item.completedAt) : timeAgo(item.createdAt);
      meta.appendChild(timeEl);

      body.appendChild(meta);

      const del = document.createElement('button');
      del.className = 'del';
      del.setAttribute('aria-label', 'Izbriši');
      del.textContent = '✕';
      del.onclick = () => deleteItem(item.id);

      note.appendChild(pin);
      note.appendChild(body);
      note.appendChild(del);
      listEl.appendChild(note);
    });
  }

  /* ---------- Add flow ---------- */
  function submitForm() {
    addItem(titleInput.value, topicsInput.value, dueInput.value);
    titleInput.value = '';
    topicsInput.value = '';
    dueInput.value = '';
    titleInput.focus();
  }

  addBtn.addEventListener('click', submitForm);

  [titleInput, topicsInput, dueInput].forEach((el, idx, arr) => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (idx < arr.length - 1) {
          arr[idx + 1].focus();
        } else {
          submitForm();
        }
      }
    });
  });

  /* ---------- Voice input: single shared recognizer, one permission prompt ---------- */
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micButtons = document.querySelectorAll('.mic-btn');
  let micPermissionGranted = false;
  let activeMicBtn = null;
  let listening = false;
  let recognition = null;

  async function ensureMicPermission() {
    if (micPermissionGranted) return true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop());
      micPermissionGranted = true;
      return true;
    } catch (e) {
      return false;
    }
  }

  if (!SpeechRecognitionAPI) {
    micButtons.forEach(btn => {
      btn.disabled = true;
      btn.title = 'Govorno vnašanje ni podprto v tem brskalniku';
    });
  } else {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'sl-SI';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      if (transcript && transcript.trim() && activeMicBtn) {
        const targetEl = document.getElementById(activeMicBtn.dataset.target);
        targetEl.value = transcript.trim();
      }
    };

    recognition.onend = () => {
      listening = false;
      if (activeMicBtn) activeMicBtn.classList.remove('listening');
      activeMicBtn = null;
    };

    recognition.onerror = () => {
      listening = false;
      if (activeMicBtn) activeMicBtn.classList.remove('listening');
      activeMicBtn = null;
    };

    micButtons.forEach(btn => {
      btn.addEventListener('click', async () => {
        if (listening) {
          recognition.stop();
          return;
        }
        const ok = await ensureMicPermission();
        if (!ok) return;
        activeMicBtn = btn;
        listening = true;
        btn.classList.add('listening');
        try {
          recognition.start();
        } catch (e) {
          listening = false;
          btn.classList.remove('listening');
          activeMicBtn = null;
        }
      });
    });
  }

  /* ---------- Tabs ---------- */
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  load();
</script>
</body>
</html>
